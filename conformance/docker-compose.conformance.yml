# OpenID Conformance Suite harness (T-0.9, REQ-126). Overlay on ../docker-compose.yml:
#   ./conformance/run.sh            (builds, seeds, runs the Basic and Config plans)
#
# Two networks, because the suite's nginx hard-codes its backend as `server`, which is also our service:
#   default  postgres, migrate, D3 Auth server (alias d3auth-server), Caddy
#   suite    the suite (alias server), its nginx (alias localhost.emobix.co.uk), MongoDB, runner, Caddy
# op-tls is the only bridge: Caddy with an internal CA terminates TLS for op.d3auth.test and proxies to
# d3auth-server, so the provider sits behind a TLS-terminating proxy exactly as it does behind the tunnel.
name: d3auth-conformance


services:
  server:
    environment:
      ISSUER: https://op.d3auth.test
      INSECURE_HTTP_ISSUER: "false"
      # ADR-002: the Basic plan does not send PKCE; only these suite clients skip it, only on a .test issuer.
      CONFORMANCE_PKCE_EXEMPT_CLIENTS: conformance-1,conformance-2,conformance-3,conformance-4
      KEK: ${CONFORMANCE_KEK:?run via conformance/run.sh}
      PEPPER: ${CONFORMANCE_PEPPER:?run via conformance/run.sh}
      COOKIE_KEYS: ${CONFORMANCE_COOKIE_KEYS:?run via conformance/run.sh}
      LOG_LEVEL: debug
      # Trust the bridge's internal CA, so back-channel logout tokens reach the suite over TLS.
      NODE_EXTRA_CA_CERTS: /conformance/op-tls/root.crt
    volumes:
      - ./conformance/seed.json:/conformance/seed.json:ro
      # A directory, not the file: replacing a bind-mounted file gives it a new inode the container
      # never sees on Linux, which is exactly what happened in CI and not on a Mac.
      - ./conformance/.op-tls:/conformance/op-tls:ro
    networks:
      default:
        aliases: [d3auth-server]

  op-tls:
    image: caddy:2.10
    volumes:
      - ./conformance/Caddyfile:/etc/caddy/Caddyfile:ro
    depends_on:
      server:
        condition: service_healthy
    networks:
      default:
        # So the provider reaches the suite's back-channel endpoint through this bridge (T-5.2).
        aliases: [localhost.emobix.co.uk]
      suite:
        aliases: [op.d3auth.test]

  mongodb:
    image: mongo:6.0.13
    tmpfs:
      - /data/db
    networks: [suite]

  suite:
    image: registry.gitlab.com/openid/conformance-suite:release-v5.2.4
    environment:
      BASE_URL: https://localhost.emobix.co.uk:8443
      BASE_MTLS_URL: https://localhost.emobix.co.uk:8444
      MONGODB_HOST: mongodb
      SPRING_PROFILES_ACTIVE: dev
      # The suite's own sign-in providers must be non-empty to boot; dev mode never uses them.
      OIDC_GOOGLE_CLIENTID: unused
      OIDC_GOOGLE_SECRET: unused
      OIDC_GITLAB_CLIENTID: unused
      OIDC_GITLAB_SECRET: unused
    depends_on: [mongodb]
    networks:
      suite:
        aliases: [server]

  suite-nginx:
    image: registry.gitlab.com/openid/conformance-suite/nginx:release-v5.2.4
    depends_on: [suite]
    ports:
      # Loopback only, to watch plans in a browser: https://localhost.emobix.co.uk:8443
      - "127.0.0.1:8443:8443"
    networks:
      suite:
        aliases: [localhost.emobix.co.uk, nginx]

  runner:
    image: python:3.13-slim
    profiles: [runner]
    working_dir: /suite-scripts
    environment:
      CONFORMANCE_SERVER: https://localhost.emobix.co.uk:8443/
      CONFORMANCE_SERVER_MTLS: https://localhost.emobix.co.uk:8444/
      CONFORMANCE_DEV_MODE: "1"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
    volumes:
      - ./conformance/.suite-scripts:/suite-scripts:ro
      - ./conformance:/conformance
    depends_on: [suite-nginx, op-tls]
    networks: [suite]

networks:
  suite: {}
