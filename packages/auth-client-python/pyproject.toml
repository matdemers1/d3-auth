[project]
name = "d3auth-client"
version = "0.0.0"
license = "Apache-2.0"
description = "D3 Auth relying-party helper for FastAPI/Starlette, over Authlib"
requires-python = ">=3.11"
dependencies = [
  "authlib>=1.3",
  "joserfc>=1.0",
  "httpx>=0.27",
  "starlette>=0.37",
]

[project.optional-dependencies]
fastapi = ["fastapi>=0.110"]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["d3auth_client*"]

# Every function here is annotated, and without this marker none of it reaches the
# consumer: mypy skips an installed package that does not claim to be typed, so a
# relying party gets `Any` back from the SDK it was careful to type against.
[tool.setuptools.package-data]
d3auth_client = ["py.typed"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
