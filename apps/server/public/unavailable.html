<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Sign-in unavailable</title>
    <style>
      /* Deliberately self-contained: this page is served when the database is unreachable,
         so it cannot depend on the console build, fonts or any other request succeeding. */
      :root { color-scheme: dark light; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
        background: #101117;
        color: #e8e9ef;
        font: 16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
      }
      main { max-width: 32rem; }
      h1 { font-size: 1.5rem; margin: 0 0 0.5rem; }
      p { margin: 0 0 0.75rem; color: #b6b9c6; }
      @media (prefers-color-scheme: light) {
        body { background: #f7f7fa; color: #16171d; }
        p { color: #4a4d5a; }
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Sign-in is unavailable right now</h1>
      <p>This is a problem on our side, not with your account or your password.</p>
      <p>Apps you are already signed in to keep working. Try signing in again in a few minutes.</p>
    </main>
  </body>
</html>
