<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="32" height="32" fill="none">
  <title>D3 Auth</title>
  <style>
    /* The D3 Auth mark (src/brand/D3AuthMark.tsx) at icon weight. A favicon cannot read the page's
       CSS variables, so the ink is the D3 light and dark --color-fg, fixed; the lit star is D3 Auth's
       accent from d3cloud.io in both. */
    .ink { stroke: #101117; }
    .joint { fill: #101117; }
    .star { fill: #8b7cf6; }
    @media (prefers-color-scheme: dark) {
      .ink { stroke: #f0f2f7; }
      .joint { fill: #f0f2f7; }
    }
  </style>
  <g class="ink" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="32" cy="32" r="26" />
    <circle cx="32" cy="25" r="7.5" />
    <path d="M28.5 31.5 L25 45 L39 45 L35.5 31.5" />
  </g>
  <circle class="joint" cx="25" cy="45" r="3.4" />
  <circle class="joint" cx="39" cy="45" r="3.4" />
  <circle class="star" cx="32" cy="25" r="5.5" />
</svg>
