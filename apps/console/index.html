<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="referrer" content="no-referrer" />
    <title>D3 Auth</title>
    <script>(function(){var p;try{p=window.localStorage.getItem("d3.theme")}catch(e){}if(p!=="light"&&p!=="dark"){try{p=window.matchMedia("(prefers-color-scheme: light)").matches?"light":"dark"}catch(e){p=null}}if(p)document.documentElement.setAttribute("data-theme",p)})();</script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
