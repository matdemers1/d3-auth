name: CI

# Gated pipeline, cheapest first: lint → unit → integration → conformance → e2e → images (REQ-134).
# Each job needs the one before it. Only the last will publish.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck

  unit:
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - name: Console build and interaction bundle budget (REQ-077)
        run: pnpm --filter d3auth-console build

  # The Python SDK has no Node in it, so it gets its own short job rather than slowing that one.
  python-sdk:
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install the package and its test tools
        run: pip install -e './packages/auth-client-python[fastapi,dev]'
      - name: Contract tests (REQ-090, REQ-093, REQ-098, REQ-099)
        run: python -m pytest packages/auth-client-python -q

  integration:
    needs: unit
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: d3auth
          POSTGRES_PASSWORD: d3auth
          POSTGRES_DB: d3auth
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U d3auth -d d3auth"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      DATABASE_URL: postgresql://d3auth:d3auth@127.0.0.1:5432/d3auth_test
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Migration drift check (schema.prisma and migrations/ must agree)
        working-directory: apps/server
        env:
          SHADOW_DATABASE_URL: postgresql://d3auth:d3auth@127.0.0.1:5432/shadow
        run: |
          PGPASSWORD=d3auth psql -h 127.0.0.1 -U d3auth -d d3auth -c 'CREATE DATABASE shadow;'
          pnpm exec prisma migrate diff --from-migrations prisma/migrations --to-schema prisma/schema.prisma --exit-code
      - run: pnpm --filter d3auth-server test:integration
      - name: Adversarial suite — the security gate (REQ-128)
        run: pnpm --filter d3auth-server test:adversarial

  conformance:
    needs: integration
    runs-on: ubuntu-latest
    # R-12 tripwire: a suite run past 30 minutes is a failure, not a wait.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: OpenID Conformance Suite — Basic and Config OP plans (REQ-126)
        run: ./conformance/run.sh
      - name: Upload suite results and stack logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: conformance-results
          path: conformance/logs/
          if-no-files-found: warn

  e2e:
    needs: conformance
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter e2e exec playwright install --with-deps chromium
      - name: Start the stack (builds the image, migrates, seeds the dev user)
        run: pnpm dev:up
      - name: Playwright flows F1, F2, F5, F6 and the a11y sweep, at phone and desktop (REQ-133, REQ-076, REQ-085)
        run: pnpm e2e
      - name: Upload the Playwright report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: e2e/playwright-report/
          if-no-files-found: ignore
      - name: Stack logs on failure
        if: failure()
        run: docker compose -f docker-compose.yml -f docker-compose.dev.yml logs --no-color server
      - if: always()
        run: pnpm dev:down

  # Only this job publishes, and only from main after everything above is green (REQ-134).
  # Deploying is still a deliberate pull-and-restart on the host (REQ-136).
  images:
    needs: [e2e, python-sdk]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}/server
          tags: |
            type=sha,format=long
            type=raw,value=latest
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/server/Dockerfile
          # The Zima host is x86_64.
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
