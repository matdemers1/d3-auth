name: CI

# Gated pipeline, cheapest first: lint → unit → integration (+ adversarial) → conformance → e2e → images
# (REQ-134), with Semgrep and the Python SDK beside it. Every one of them must pass before an image is built.
# Each job needs the one before it. Only the last will publish.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck

  unit:
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - name: Console build and interaction bundle budget (REQ-077)
        run: pnpm --filter d3auth-console build

  # Static security (T-5.3, REQ-130): the registry packs plus D3 Auth's own rules, zero findings or
  # no images. The container is pinned by digest for the same reason the actions are pinned by SHA.
  semgrep:
    needs: lint
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep@sha256:34ab619bf1391a24bfda3f05debd0d8a6ce3093c2d5f9d39cfc00f83c1397823 # 1.176.1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: The custom rules prove themselves first
        run: cd .semgrep && semgrep --test --metrics=off .
      - name: Scan (p/jwt, p/owasp-top-ten, p/typescript, p/nodejs, .semgrep/d3auth.yml)
        run: >-
          semgrep scan --metrics=off --error
          --config p/jwt --config p/owasp-top-ten --config p/typescript --config p/nodejs
          --config .semgrep/d3auth.yml .

  # The Python SDK has no Node in it, so it gets its own short job rather than slowing that one.
  python-sdk:
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Install the package and its test tools
        run: pip install -e './packages/auth-client-python[fastapi,dev]'
      - name: Contract tests (REQ-090, REQ-093, REQ-098, REQ-099)
        run: python -m pytest packages/auth-client-python -q

  integration:
    needs: unit
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: d3auth
          POSTGRES_PASSWORD: d3auth
          POSTGRES_DB: d3auth
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U d3auth -d d3auth"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      DATABASE_URL: postgresql://d3auth:d3auth@127.0.0.1:5432/d3auth_test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Migration drift check (schema.prisma and migrations/ must agree)
        working-directory: apps/server
        env:
          SHADOW_DATABASE_URL: postgresql://d3auth:d3auth@127.0.0.1:5432/shadow
        run: |
          PGPASSWORD=d3auth psql -h 127.0.0.1 -U d3auth -d d3auth -c 'CREATE DATABASE shadow;'
          pnpm exec prisma migrate diff --from-migrations prisma/migrations --to-schema prisma/schema.prisma --exit-code
      # The backup tests dump and restore for real, and pg_dump refuses a server newer than itself.
      - name: Postgres 16 client tools
        run: |
          if ! pg_dump --version | grep -q ' 16\.'; then
            sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client-16
            echo "/usr/lib/postgresql/16/bin" >> "$GITHUB_PATH"
          fi
          /usr/lib/postgresql/16/bin/pg_dump --version 2>/dev/null || pg_dump --version
      - run: pnpm --filter d3auth-server test:integration
      - name: Adversarial suite — the security gate (REQ-128)
        run: pnpm --filter d3auth-server test:adversarial

  conformance:
    needs: integration
    runs-on: ubuntu-latest
    # R-12 tripwire: a suite run past 30 minutes is a failure, not a wait.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: OpenID Conformance Suite — Basic, Config, RP-Initiated and Back-Channel Logout (REQ-126, REQ-127)
        run: ./conformance/run.sh
      - name: Upload suite results and stack logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: conformance-results
          path: conformance/logs/
          if-no-files-found: warn

  # The D3 App contract (AUTH-T-9.6): the suite D3 Constellation's contract publishes, against this
  # commit's stack. D3 Auth signs native clients in through the browser (AUTH-ADR-008), so the
  # manifest checks and me.unauthenticated run and the native session checks skip by design.
  #
  # The suite's image is public, as matdemers1/d3-app-contract is, so it is pulled with no token.
  # `contract-suite` checks first that it can be: when it cannot, this job is skipped — never
  # green having run nothing — and that job's summary carries the reason (CON-T-002).
  app-contract:
    name: app-contract (d3-app-contract)
    needs: [integration, contract-suite]
    if: needs.contract-suite.outputs.available == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Start the stack
        run: pnpm dev:up
      - name: The d3-app-contract suite
        run: |
          docker run --rm --network host -v "$PWD:/out" ghcr.io/matdemers1/d3-app-conformance:contract-1 \
            --base http://localhost:3000 --allow-http --product d3auth --destructive --junit /out/conformance.xml
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: app-contract
          path: conformance.xml
          if-no-files-found: ignore
      - if: always()
        run: pnpm dev:down

  # Whether the d3-app-contract suite can be fetched at all (AUTH-T-9.6, CON-T-002). The contract repo
  # and its image are public, so this pulls with no token. When the image cannot be pulled — made
  # private again, a renamed tag, GHCR down — `app-contract` is skipped rather than reported as a pass
  # that measured nothing, and this job's summary says why.
  contract-suite:
    name: d3-app-contract suite available
    runs-on: ubuntu-latest
    outputs:
      available: ${{ steps.probe.outputs.available }}
    steps:
      - name: Can the suite's image be pulled anonymously?
        id: probe
        env:
          IMAGE: ghcr.io/matdemers1/d3-app-conformance:contract-1
        run: |
          if out="$(docker manifest inspect "$IMAGE" 2>&1)"; then
            echo "available=true" >> "$GITHUB_OUTPUT"
            echo "The d3-app-contract suite (\`$IMAGE\`) is pullable, so \`app-contract\` runs it." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          echo "available=false" >> "$GITHUB_OUTPUT"
          echo "::warning title=d3-app-contract suite skipped::$IMAGE cannot be pulled, so app-contract is skipped: it did not run and did not pass."
          {
            echo "## d3-app-contract conformance: SKIPPED"
            echo
            echo "The suite did **not** run, so this run says nothing about the D3 App contract."
            echo
            echo "**Reason:** \`$IMAGE\` cannot be pulled anonymously:"
            echo
            echo '```'
            printf '%s\n' "$out"
            echo '```'
            echo
            echo "The package must be public: https://github.com/users/matdemers1/packages/container/d3-app-conformance/settings"
          } >> "$GITHUB_STEP_SUMMARY"

  e2e:
    needs: conformance
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter e2e exec playwright install --with-deps chromium
      - name: Start the stack (builds the image, migrates, seeds the dev user)
        run: pnpm dev:up
      - name: Playwright flows F1, F2, F5, F6 and the a11y sweep, at phone and desktop (REQ-133, REQ-076, REQ-085)
        run: pnpm e2e
      - name: Upload the Playwright report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: playwright-report
          path: e2e/playwright-report/
          if-no-files-found: ignore
      - name: Stack logs on failure
        if: failure()
        run: docker compose -f docker-compose.yml -f docker-compose.dev.yml logs --no-color server
      - if: always()
        run: pnpm dev:down

  # Only this job publishes, and only from main after everything above is green (REQ-134).
  # Deploying is still a deliberate pull-and-restart on the host (REQ-136).
  images:
    needs: [e2e, python-sdk, semgrep]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # The Shipyard deploy contract (AUTH-T-002, SHP-D-019, SHP-D-022): the migration posture
      # from the HEAD commit's `Shipyard-Migration:` trailer, and the schema this image ships —
      # the same value /health reports once it has run.
      - id: shipyard-labels
        run: ./scripts/shipyard-labels.sh "$GITHUB_SHA" | tee -a "$GITHUB_OUTPUT"
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ghcr.io/${{ github.repository }}/server
          tags: |
            type=sha,format=long
            type=raw,value=latest
          labels: |
            dev.d3cloud.shipyard.migration=${{ steps.shipyard-labels.outputs.migration }}
            dev.d3cloud.shipyard.schema=${{ steps.shipyard-labels.outputs.schema }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: apps/server/Dockerfile
          # The Zima host is x86_64.
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      # The Express example, published so Shipyard can deploy demo.d3cloud.io like any other app
      # (AUTH-T-001, SHP-T-1.13): a sha- tag and a revision label, from main only.
      - id: demo-meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ghcr.io/${{ github.repository }}/demo
          tags: |
            type=sha,format=long
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: examples/express
          file: examples/express/Dockerfile
          platforms: linux/amd64
          push: true
          build-args: REVISION=${{ github.sha }}
          tags: ${{ steps.demo-meta.outputs.tags }}
          labels: ${{ steps.demo-meta.outputs.labels }}
          cache-from: type=gha,scope=demo
          cache-to: type=gha,scope=demo,mode=max
